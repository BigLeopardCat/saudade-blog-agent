version: 2

updates:
  # pyproject.toml 和 uv.lock 必须配套更新，CI 使用锁定安装验证。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    # 大版本独立迁移；此限制仅影响常规版本更新，不限制安全修复。
    allow:
      - update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # SDK 与适配库在同一兼容更新组内解析，避免只更新一侧造成版本冲突。
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    allow:
      - update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "chore"
    groups:
      widget-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 工作流工具与运行依赖分开评审。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
