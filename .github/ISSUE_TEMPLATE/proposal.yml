name: 提议一个改动 / 一个方向
description: 新能力、行为调整、或者"这个以后该做但现在不做"
title: "proposal: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请描述当前问题、预期行为、影响范围和可验证的验收条件。
        涉及跨仓接口时，附上配套仓库及兼容要求。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述可复现的现状，附脱敏日志或 trace 标识。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你打算怎么做
      description: |
        改哪些文件、动哪条链路。若改动会碰到行为契约（工具返回、SSE 帧、提示词前缀、
        跨语言字面），请点名。
    validations:
      required: true
  - type: textarea
    id: judge
    attributes:
      label: 判据：哪一行会变红
      description: |
        本仓的规矩是每个行为改动都要带一条判据，而且这条判据必须能抓住"它其实没生效"。
        请写：改坏了什么、哪条断言会红。**"加个测试"不算答案。**
      placeholder: |
        判据：<套件> 的 <第几条>
        打桩检查：把 <函数> 改成恒真返回，这条必须变红
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: 什么时候做
      options:
        - 现在就该做（条件已满足）
        - 以后做——我把触发条件写在下面
        - 只是提一下，不打算现在做
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 触发条件（上面选"以后做"时必填）
      description: |
        必须是**可观测**的。"以后有需要再做"不是触发条件——它永远不会到期。
        好例子：「语料 >100 篇」「站内图片 ≥1000 张」「某条读数连续 N 次为 0」。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它做法，以及为什么不选
      description: 说明备选方案及当前取舍。
    validations:
      required: false
