name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit validation needs the base object and the complete commit range.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Widget Markdown security regression
        run: node --test frontend/tests/*.test.mjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: 提交信息闸门（与本地同一份 .githooks/commit-msg）
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "取不到 base 提交 ${BEFORE} ⇒ 本次跳过提交信息校验（**不是**通过）"
            exit 0
          fi
          fail=0
          MSGFILE="$(mktemp)"
          trap 'rm -f "$MSGFILE"' EXIT
          while read -r sha; do
            [ -n "$sha" ] || continue
            git log -1 --format=%B "$sha" > "$MSGFILE"
            if ! bash .githooks/commit-msg "$MSGFILE"; then
              echo "::error::提交 ${sha:0:9} 的信息不合规（见上面的说明）"
              fail=1
            fi
          done < <(git log --no-merges --format=%H "${BEFORE}..${SHA}")
          exit "$fail"

      - name: 未定义名静态扫描（ruff F821，秒级）
        run: uv run --frozen ruff check --select F821 --no-cache .

      - name: 类型检查棘轮（mypy 错误数只许变小）
        run: uv run --frozen python eval/type_gate.py

      - name: 静态检查棘轮（ruff E/F/I/W 只许变小）
        run: uv run --frozen python eval/lint_gate.py

      - name: 盲捕获棘轮（BLE001 只许变小）
        run: uv run --frozen python eval/except_gate.py

      - name: 安全扫描棘轮（bandit 只许变小）
        run: uv run --frozen python eval/security_gate.py

      - name: 跨语言守卫的凭据自检（缺了就直接红；fork PR 走显式降级）
        id: parent
        env:
          PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -n "${PARENT_REPO_TOKEN:-}" ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "pull_request" ] && { [ "${IS_FORK}" = "true" ] || [ "${ACTOR}" = "dependabot[bot]" ]; }; then
            echo "available=0" >> "$GITHUB_OUTPUT"
            echo "::warning::fork/Dependabot PR 无父仓凭据，跨语言守卫未运行。详见 job summary。"
            {
              echo "### ⚠️ 跨语言守卫本次**未运行**（这不是通过）"
              echo ""
              echo "fork 和 Dependabot PR 不能使用普通 Actions secrets。"
              echo ""
              echo "**本次没有运行**：所有读父仓源码的跨语言守卫。"
              echo ""
              echo "**照常运行**：其余全部离线套件、未定义名扫描、类型棘轮、静态检查棘轮、提交信息闸门。"
              echo ""
              echo "合并到 \`main\` 后那次 \`push\` 会带凭据重跑，届时这些守卫才真判。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::缺 secrets.PARENT_REPO_TOKEN。跨语言守卫（断言 Rust 侧真有那个臂/那个键）在 CI 里**必须真跑**——凭据缺失是配置问题，配置问题的正确表现是红，不是静默跳过。配置步骤见 docs/adr/adr-0004-cross-language-guard-in-ci.md"
          exit 1

      - name: 取父仓源码（只读、浅、稀疏）
        if: steps.parent.outputs.available == '1'
        uses: actions/checkout@v4
        with:
          repository: BigLeopardCat/Saudade-Blog
          token: ${{ secrets.PARENT_REPO_TOKEN }}
          path: _parent
          sparse-checkout: |
            src/routes
            frontend/src/utils
            frontend/src/components/NoteTagSelect
          fetch-depth: 1
          persist-credentials: false

      - name: 父仓落位自检（锚 + 每一条锥模式都真拉到）
        if: steps.parent.outputs.available == '1'
        run: |
          set -e
          test -f _parent/src/routes/chat.rs
          test -f _parent/frontend/src/utils/stickers.ts
          test -f _parent/frontend/src/components/NoteTagSelect/index.tsx
          test -f _parent/src/authz.rs

      # Both credential modes use the same complete pytest collection.
      - name: 全部离线套件
        env:
          SAUDADE_PARENT_REPO: ${{ steps.parent.outputs.available == '1' && format('{0}/_parent', github.workspace) || '' }}
          SAUDADE_REQUIRE_PARENT: ${{ steps.parent.outputs.available == '1' && '1' || '0' }}
        run: uv run --frozen pytest -q -n 4 --durations=15 --junitxml=eval/report/ci/pytest.xml

      - name: 保存测试报告（含失败用例和耗时）
        if: ${{ !cancelled() && hashFiles('eval/report/ci/pytest.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/report/ci/pytest.xml
          if-no-files-found: error
          retention-days: 14

  widget-pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 与父仓 pin 比对（漂移则 ::warning::，恒退 0）
        env:
          PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
        run: bash scripts/widget_pin_drift.sh
