# Eval Gate —— push 跑秒级单测（L0）。
#
# **golden 全量评测集不进 CI（20260920 撤下）**，改为本机按需手动跑。
# 撤下的实测依据（run 35499800723 / 35506176321）：
#   - 北美 runner 调北美阿里云端点这条 LLM 腿**每次调用先吊住 ~120 秒**再走重试
#     （ChatOpenAI timeout=120s × langchain max_retries=2 ⇒ 单次调用最坏 6 分钟）；
#   - 3 条本机合计 39 秒的用例，在 CI 里跑 21 分钟仍未结束；期间生产机 access log
#     显示：18:50:37 语料热身（12 个请求）之后再无一个工具请求 ⇒ 卡在 LLM 腿，
#     与"回国调站点"那一腿无关（那一段实测健康，服务端 0-3ms）；
#   - 一次 120 分钟上限的全量跑被杀，且**零产出**（报告只在结尾写 + 非 TTY 块缓冲，
#     日志与 artifact 双双为空）。
#
# 全量 golden 在本机跑（本机即生产服务器，链路真实，74 条约 19 分钟）：
#   cd saudade-blog-agent
#   .venv/bin/python eval/run_golden.py                     # 全量；--limit N / --only a,b / --min-pass-rate
#   .venv/bin/python eval/golden_full_run.py                # 进程隔离版：逐条独立进程 + 180s 超时，防悬挂
#   夜间 04:00 已有 scripts/nightly_regression.sh（crontab）跑 tests/test_skills.py + 全量 golden + trace 巡检。
#
# 仓库 Secrets QUALITY_GATE_API_KEY / QUALITY_GATE_BASE_URL 与 Variables
# GOLDEN_MIN_PASS_RATE / QWEN_MODEL 已无引用，可留可删（留下不影响任何运行）。
name: Eval Gate

on:
  push:
    branches: [main]
  # 手动重跑秒级套件（无入参）；全量 golden 请按上面注释在本机跑
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen

      - name: 技能注册表/plan 契约单元测试（秒级，纯函数）
        run: uv run python tests/test_skills.py

      - name: 服务加固单元测试（TLS 校验/输入限额/请求体积/并发闸/工具返回三类，秒级，无网络）
        run: uv run python tests/test_hardening.py

      - name: 协作取消能力边界测试（stop_event 检查点/写操作不被执行，秒级，无网络）
        run: uv run python tests/test_cancel.py

      - name: 实体摘要单测（数据工具返回 → 可引用实体行，秒级，纯函数）
        run: uv run python tests/test_entities.py

      - name: golden 判据离线自测（词表/正则族/引述豁免，秒级，纯文本函数，无网络）
        run: uv run python tests/judge_offline_test.py

      - name: 权限模型单测（scope 声明完备性/角色授予表/失败取向，秒级，纯函数）
        run: uv run python tests/test_authz.py

      - name: 侧任务单测（留言审核/对话摘要：不可信输入围栏 + 输出白名单 + 失败取向，秒级，假模型不联网）
        run: uv run python tests/test_side_tasks.py

      - name: 超长文章单测（分节/按节取回/帧节选：索引与渲染同一套节边界、不无声截断，秒级，纯函数不联网）
        run: uv run python tests/test_sections.py

      - name: 管理助手报表单测（/proc 解析与渲染/读不到≠空/命令前缀消毒/后台代调失败取向，秒级，假 httpx 不联网）
        run: uv run python tests/test_reports.py

      - name: 管理助手写操作单测（失败取向/三道门·权限·确认·目标/写去重 args-aware/回执契约，秒级，假 httpx 不联网）
        run: uv run python tests/test_admin_write.py

      - name: 写操作确认弹窗单测（确认令牌签发/验签·fail-closed/弹窗触发矩阵/点确定后的执行轮，秒级，纯函数不联网）
        run: uv run python tests/test_confirm.py

      - name: 写目标名来源态单测（目标名只能由引号段/免引号目标名/目标槽位取出·判据无词表·弹卡用例不误伤，秒级，不联网）
        run: uv run python tests/test_target_grounding.py

      - name: 标签/分类写能力单测（名字通道四态·影响面播报·写通道形态·弹窗问句，秒级，假 httpx 不联网）
        run: uv run python tests/test_tag_admin.py

      - name: 用户自己的数据单测（收藏/未读/通知：读完不等于空·未登录零请求·措辞不串后台，秒级，假 httpx 不联网）
        run: uv run python tests/test_userdata.py

      - name: golden trace 落盘单测（目录守卫/uid 恒 0/三个跑法接线/prune 只删时间戳目录，秒级，不联网）
        run: uv run python tests/test_golden_trace.py

      - name: 回归组重跑单测（假 LLM 驱动 main：复跑才绿按方差放行但必须出声/复跑不许覆盖首跑/能力题不重跑，秒级，不联网）
        run: uv run python tests/golden_rerun_offline_test.py

      - name: 跨源对账单测（假夹具喂每条判据两侧/窗口裁剪/伪造字段/gz 往返，并断言夜间脚本真的接了线，秒级，不联网）
        run: uv run python tests/reconcile_offline_test.py

      - name: golden 断言键拼写校验（反射扫取键字面量 × 表 × 逐条用例三向交叉，秒级，不联网）
        run: uv run python tests/test_golden_keys.py

      - name: 语料术语派生单测（过滤五条规则/排序截断/申报失配，秒级，内联夹具不联网）
        run: uv run python tests/test_corpus_terms.py

      - name: SSE 终止帧契约（真调 chat_stream：异常/空闲超时两条路径 + 换行不撕帧 + 全仓发出点都 JSON 编码，秒级，不联网不调 LLM）
        run: uv run python tests/test_error_frame.py

      # 未定义名静态扫描（20260924 补）。Python 没有编译期拦截：一个只在**另一个作用域**
      # 存在的名字（server.py 的 `req` 写进了 `_run_agent_stream_to_queue`）要到运行到那一行
      # 才炸，而线上位置恰在图启动前 ⇒ 表现成"整轮零帧"，看着像模型没回复。那次事故挂了
      # 40 分钟、离线套件与夜间 golden 全都碰不到（见 docs/问题记录.md 1.43）。
      # 只开 F821 这一条规则是刻意的：其余 F/E 类（未使用导入等）不应拦住一次修复性推送。
      # 本机同款命令：uvx ruff check --select F821 --no-cache .
      - name: 未定义名静态扫描（ruff F821，秒级）
        run: uvx ruff@0.14.4 check --select F821 --no-cache .
