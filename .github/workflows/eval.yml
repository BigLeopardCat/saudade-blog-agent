# Eval Gate —— push 跑秒级单测（L0）。
#
# **golden 全量评测集不进 CI（20260920 撤下）**，改为本机按需手动跑。
# 撤下的实测依据（run 35499800723 / 35506176321）：
#   - 北美 runner 调北美阿里云端点这条 LLM 腿**每次调用先吊住 ~120 秒**再走重试
#     （ChatOpenAI timeout=120s × langchain max_retries=2 ⇒ 单次调用最坏 6 分钟）；
#   - 3 条本机合计 39 秒的用例，在 CI 里跑 21 分钟仍未结束；期间生产机 access log
#     显示：18:50:37 语料热身（12 个请求）之后再无一个工具请求 ⇒ 卡在 LLM 腿，
#     与"回国调站点"那一腿无关（那一段实测健康，服务端 0-3ms）；
#   - 一次 120 分钟上限的全量跑被杀，且**零产出**（报告只在结尾写 + 非 TTY 块缓冲，
#     日志与 artifact 双双为空）。
#
# 全量 golden 在本机跑（本机即生产服务器，链路真实，约 127 条 / 25 分钟）：
#   cd saudade-blog-agent
#   .venv/bin/python eval/run_golden.py                     # 全量；--limit N / --only a,b / --min-pass-rate
#   .venv/bin/python eval/golden_full_run.py                # 进程隔离版：逐条独立进程 + 180s 超时，防悬挂
#   夜间 04:00 有 scripts/nightly_regression.sh（crontab）跑 tests/run_all.py + 全量 golden + trace 巡检，
#   **但那个 cron 默认不装**（一次全量 ≈10M tok / ¥2.4；开关 scripts/enable_nightly.sh）——
#   所以上面那句"CI 只跑 L0"在默认部署下是全部，别把没跑的夜间当成跑过且绿。
#
# 仓库 Secrets QUALITY_GATE_API_KEY / QUALITY_GATE_BASE_URL 与 Variables
# GOLDEN_MIN_PASS_RATE / QWEN_MODEL 已无引用，可留可删（留下不影响任何运行）。
#
# **这个 workflow 需要一枚只读凭据**：`secrets.PARENT_REPO_TOKEN`（父仓私有 ⇒ 跨语言守卫
# 在 CI 里要读它的源码才能真判）。缺了就红——配置问题的正确表现是红，不是静默跳过。
# 生成/授权/轮换步骤见 docs/adr/adr-0004-cross-language-guard-in-ci.md。
name: Eval Gate

on:
  push:
    branches: [main]
  # 手动重跑秒级套件（无入参）；全量 golden 请按上面注释在本机跑
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # 父仓只读凭据放 **job 级 env**：step 的 `if:` 里读不了 `secrets`（GitHub 表达式不允许
    # `secrets` 出现在 `if` 中）⇒ 只能先落成环境变量，再用 `env.X` 判。
    env:
      PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 提交信息闸门要跑 `git log BEFORE..SHA`（比本次 push 带来的那个区间），
          # 而默认的 `fetch-depth: 1` 只有一条提交 ⇒ 每一步都会落进"取不到基线 ⇒ 跳过"，
          # **闸门看着在跑、其实一次都没判**（本仓最贵的那类失效）。
          fetch-depth: 0

      # 跨语言守卫（断言 Rust 侧真有那个臂/那个键/那个字面）此前在 CI 里**恒跳过**：CI 只
      # checkout agent 仓，而父仓私有 ⇒ 最需要它的地方从不运行，本机绿、CI 也绿，两侧谁都没
      # 真比过（20260928 审计实测）。现在父仓以**只读凭据**拉进来真判。取舍与轮换步骤见
      # docs/adr/adr-0004-cross-language-guard-in-ci.md。
      - name: 跨语言守卫的凭据自检（缺了就直接红，不让六处守卫各自红一遍）
        run: |
          if [ -z "${PARENT_REPO_TOKEN:-}" ]; then
            echo "::error::缺 secrets.PARENT_REPO_TOKEN。跨语言守卫（断言 Rust 侧真有那个臂/那个键）在 CI 里**必须真跑**——凭据缺失是配置问题，配置问题的正确表现是红，不是静默跳过。配置步骤见 docs/adr/adr-0004-cross-language-guard-in-ci.md"
            exit 1
          fi

      - name: 取父仓源码（只读、浅、稀疏）
        uses: actions/checkout@v4
        with:
          repository: BigLeopardCat/Saudade-Blog
          token: ${{ secrets.PARENT_REPO_TOKEN }}
          path: _parent
          # 守卫读的全是 `src/routes/*.rs`。锥里曾有过 `frontend/public/live2d-widgets`
          # （`__RESET__:<scope>` 那条帧约定三端认同一份字面，前端那一端在
          # `tests/test_reset_scope.py` 里读）——20261001 看板娘前端随 MIT 分发搬进了
          # **本仓** `frontend/`，那条守卫改成读本仓，父仓这一条锥模式随之作废。
          # 稀疏锥只为把面收小、把时间省掉；**锥够不够**由 `tests/test_ci_suite_list.py` ⑥
          # 机械核对——它扫所有 `_parent_repo.read("…")` 的路径逐个判是否落在锥里，
          # 加了读别处的守卫而忘了改这里会红，而不是"那一条在 CI 上悄悄不判"。
          # 20261002 加 `frontend/src/utils`：`tests/test_sticker_repair.py` 要拿父仓那份
          # 贴纸清单（`stickers.ts::STICKERS`）与 agent 侧 `agent/stickers.py::STICKER_NAMES`
          # 逐字核对——"名字清单三处同步"是这套契约里唯一能机器化的那一处。
          # 20261013 加 `frontend/src/components/NoteTagSelect`：`tests/test_tag_color_tables.py`
          # 要核对站内 8 色板的**第三处**（用户手建标签时前端自己按名字取色），以及两侧
          # 哈希算子（Python `_utf16_units` ↔ JS `charCodeAt`）同源。⚠️ 这一处**不在**
          # `frontend/src/utils` 里，只加 utils 那个锥会让它读不到。
          sparse-checkout: |
            src/routes
            frontend/src/utils
            frontend/src/components/NoteTagSelect
          fetch-depth: 1
          persist-credentials: false

      - name: 父仓落位自检（锚 + 每一条锥模式都真拉到）
        # 凭据权限不对时上一步就失败了；这一条兜的是"拉下来了但稀疏锥配错"——空目录/错目录会
        # 让守卫**假绿**（`tests/_parent_repo.py` 头注里那两条边界之一）。**锥里每一条模式都要
        # 探一次**：`_parent_repo.read` 遇到"文件不在"是按三态走的（本机单跑会打 ⏭ 继续），
        # 锥漏掉一条模式的表现因此是"那条守卫悄悄不判"，只有在这里才看得见。
        run: |
          set -e
          test -f _parent/src/routes/chat.rs
          test -f _parent/frontend/src/utils/stickers.ts
          test -f _parent/frontend/src/components/NoteTagSelect/index.tsx
          # 这一条**不是**锥模式，是锥的**语义**：cone 模式会连同"锥目录的各级祖先目录里的
          # 直系文件"一起拉下来（`.git/info/sparse-checkout` 里那几行 `!/src/*/` 就是干这个的）
          # ⇒ `src/*.rs`（authz.rs / quota.rs …）本来就在。20261013 批 3b 探过这一条：
          # 顺手加一条 `src/authz` 进锥**会让 checkout 直接失败**（它不是一个目录）。
          test -f _parent/src/authz.rs

      # ⚠️ 20260928 首跑带出两条**信息性**注解（不影响本次绿）：`actions/checkout@v4` 与
      # `astral-sh/setup-uv@v5` 是针对 Node 20 的，runner 已强制它们跑在 Node 24 上。等上游
      # 退役 Node 20 支持时这两步会失效——升到 v5 / v6 是**另一件事**（要连带核对 checkout 在
      # 父仓那一处用的 `sparse-checkout` 输入是否改名），别混进无关的提交里。
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          # 与 `requires-python` / `.python-version` 同一个值（`tests/test_packaging.py`
          # ⑥ 判着——CI 装 3.10 而声明 3.12 是"CI 绿但产线跑不了"那种假绿的反面：
          # 声明 3.12 而 CI 只验 3.10，等于**升版这件事根本没被任何东西验过**）。
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # 提交信息闸门（20261018）。规则的正文**只写在** `CONTRIBUTING.md` 的《3. 提交约定》，
      # 这里跑的就是那份钩子脚本本身（`.githooks/commit-msg`）——**一份实现两处共用**。
      # 为什么 CI 也要跑一遍：`core.hooksPath` 是 git 的本地配置（`.git/config`，不入库），
      # 不会被 clone 带走 ⇒ 只挂本机钩子等于"闸门只对配过 `scripts/dev/install-hooks.sh`
      # 的人生效"。这一层不依赖任何人的本地配置，它才是闸门。
      # ⚠️ 这里**必须**直接调 `.githooks/commit-msg`，不许改调 `tests/test_commit_msg_hook.py`：
      # `tests/test_ci_suite_list.py` ① 判的是"套件清单只有 `tests/run_all.py` 一处"，
      # 逐套件点名会让那一条当场红。那个套件自己（钩子在不在、坏消息会不会被拒、
      # type 白名单与 CONTRIBUTING 是否逐字同源）走下面的 `run_all.py`。
      # 本仓没有 `.github/dependabot.yml`（`tests/test_packaging.py` ③ 判着），所以这里
      # **不做**父仓那份 dependabot 豁免。真启用机器人时它会在这里红——那是一次可见的、
      # 需要人加一行豁免的红，而不是一个"首行长度不由人控制"的慢性假红。
      - name: 提交信息闸门（与本地同一份 .githooks/commit-msg）
        env:
          # PR 上没有 `github.event.before`（那不是 push 事件）。本 workflow 目前只
          # `push: branches: [main]`，所以这里只取 before；将来加了 `pull_request`，
          # 照父仓那份补 `|| github.event.pull_request.base.sha`。
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 首推/强推/新建分支时 before 是全 0 或已被回收 —— 取不到基线就整段跳过。
            # 宁可漏一次也别在这里造一个假红（它没有可对照的范围）。**响亮地**说出来：
            # "跳过"不是"通过"。
            echo "取不到 base 提交 ${BEFORE} ⇒ 本次跳过提交信息校验（**不是**通过）"
            exit 0
          fi
          fail=0
          MSGFILE="$(mktemp)"
          while read -r sha; do
            [ -n "$sha" ] || continue
            git log -1 --format=%B "$sha" > "$MSGFILE"
            if ! bash .githooks/commit-msg "$MSGFILE"; then
              echo "::error::提交 ${sha:0:9} 的信息不合规（见上面的说明）"
              fail=1
            fi
          done < <(git log --no-merges --format=%H "${BEFORE}..${SHA}")
          exit "$fail"

      # 套件清单**只有一处事实源**：`tests/run_all.py` 按**磁盘**枚举 `tests/*.py`
      # （`_` 开头的辅助模块与 run_all 自己除外）。此前这里是**手工维护**的名单（一个套件一个
      # step），而审计实测（20260928）：磁盘上 50+ 个套件、这份名单只引用了 26 个
      # ⇒ **一半以上的判据在 CI 里从不运行**——其中就有 `test_prompt_prefix`（提示词前缀缓存
      # 稳定性的唯一哨兵）与 `test_slim_workflows`。加了新套件忘了来这里加一行，表现是
      # "看着在跑、其实没跑"，而这种失效没有任何东西会告诉你。
      # 收敛成一条 step 之后，**加套件不用改 CI**。回归锁：`tests/test_ci_suite_list.py`
      # 断言这里不许再出现逐套件的 `tests/test_*.py` 调用，也断言夜间脚本与本文同源。
      # 全套秒级、无网络、无 LLM；run_all.py 内部钉住出厂档（`_PINNED`：AGENT_EVIDENCE=0 /
      # AGENT_FASTPATH=1 / RAG_HYBRID_ENABLED=0 / IOT_ENABLED=1 / SAUDADE_IGNORE_ENV_FILE=1——
      # 20261004 删掉了 `PLANNER_ENGINE` 那一钉：接口层只剩 native 一条，没有第二个取值可钉；
      # 20261015 又删掉了 `AGENT_TASK_STATE` / `AGENT_TASK_PLAN_EXEC` 两钉：任务状态整族撤档、
      # 常开。钉子表没被清空，理由见 `tests/run_all.py` 那段 ⚠️），
      # 即给子进程设 `SAUDADE_IGNORE_ENV_FILE=1`（**整份 .env 不读**）
      # ⇒ 判据不随仓库/运维环境的取值漂移。20260928 加后半句的实测理由：CI 没有 .env、
      # 本机有产线那份 ⇒ 同一片判据在这里红、在本机绿，而两边都没在看代码。
      # 跨语言守卫**跑不到就算红**（`tests/_parent_repo.py` 的三态），与夜间同一条纪律：
      # `SAUDADE_REQUIRE_PARENT=1` 让"找不到父仓"变成一行 ❌ + 退出码 1，而不是一行谁也不会
      # 读的 ⏭。父仓这次**真在**（上面两步），所以这一档在 CI 里判的是真东西。
      # 注意它比较的是父仓**默认分支**的 HEAD：Rust 那边的改动还没并进默认分支时，这里会红
      # 而本机（工作区里带着那份改动）是绿的——这是**可见的**红，不是静默的绿（取舍见 ADR-0004）。
      - name: 全部离线套件（按磁盘枚举，秒级、无网络、无 LLM）
        env:
          SAUDADE_PARENT_REPO: ${{ github.workspace }}/_parent
          SAUDADE_REQUIRE_PARENT: "1"
        run: uv run python tests/run_all.py

      # 未定义名静态扫描（20260924 补）。Python 没有编译期拦截：一个只在**另一个作用域**
      # 存在的名字（server.py 的 `req` 写进了 `_run_agent_stream_to_queue`）要到运行到那一行
      # 才炸，而线上位置恰在图启动前 ⇒ 表现成"整轮零帧"，看着像模型没回复。那次事故挂了
      # 40 分钟、离线套件与夜间 golden 全都碰不到（见 docs/问题记录.md 1.43）。
      # 只开 F821 这一条规则是刻意的：其余 F/E 类（未使用导入等）不应拦住一次修复性推送。
      # **ruff 的版本从 `pyproject.toml` 的 `[dependency-groups] dev` 来**（上面
      # `uv sync --frozen` 已经把它按 uv.lock 装进项目环境），不再在这里手写
      # `uvx ruff@0.14.4`——同一件事写两处就是"改一处忘另一处"的形状（本轮 20260928 收敛）。
      # 本机跑同一条判据用隔离的 `uvx ruff@0.14.4 check --select F821 --no-cache .`
      # （**不许**在本机 `uv sync`：`.venv` 就是产线那个 venv）；版本若升，两处一起改，
      # `tests/test_ci_suite_list.py` ①b 会盯着它们是否同版。
      - name: 未定义名静态扫描（ruff F821，秒级）
        run: uv run --frozen ruff check --select F821 --no-cache .

      # 类型检查棘轮（20261013 补）。`[tool.mypy]` 那段配置（`pyproject.toml` 末尾）
      # 在此之前**从不执行**——mypy 不在依赖、不在 `uv.lock`、CI 没有这一步，而函数签名已
      # 注释约 78% ⇒ 写了从不校验。配上以来第一次真跑：`212 errors in 21 files (checked 46)`。
      # **不是一次性门禁而是棘轮**：一上来要求全绿会让 CI 恒红，人人学会无视它；改记基线、
      # 只许变小（照 `eval/complexity_baseline.json` 同款）。判据两条：总数变大、或**某个文件**
      # 变大（防"这边修三个、那边坏两个"在总数上互相抵消）。
      # ⚠️ mypy 的版本从 `pyproject.toml` 的 dev 组来（上面 `uv sync --frozen` 已按 uv.lock 装好），
      # 而 `eval/mypy_baseline.json` 里记着出基线时的版本——**两者对不上直接退 3**：换了 mypy
      # 版本就换了一套错误集，棘轮不再是同一个量，这时要跑 `--update` 重出基线（升级 PR 里做）。
      # 本机（产线 venv，**不许** `uv sync`）跑同一条判据用隔离的
      # `python eval/type_gate.py --mypy "uvx mypy@2.4.0"`（与 dev 组同版）。
      - name: 类型检查棘轮（mypy 错误数只许变小）
        run: uv run --frozen python eval/type_gate.py

      # 静态检查棘轮（20261018 补，审计 A3）。`[tool.ruff.lint] select = ["E","F","I","W"]`
      # 从 20260927 起就写在 `pyproject.toml` 里，而 CI 至今只跑上面那条 `--select F821`
      # ——剩下那一大片（会烂的那一类）的唯一约束是 `docs/lint-baseline.md` 里的散文纪律。
      # 同族的第三道棘轮（`eval/type_gate.py`）同款：记基线、只许变小、`--update` 是唯一
      # 放宽通道。判据三条：总数变大 / **某个文件**变大 / **基线里没有的文件**带 error
      # （新文件按纪律 1 必须零 error，它的基线是 0）。
      # ⚠️ **三个量任一换掉就退 3**（ruff 版本、`line-length`、`select`）——它们都会改变
      # 条目集，换了就不是同一个量；三个的真值都只有 `pyproject.toml` 一处。
      # 本机（产线 venv，**不许** `uv sync`）跑同一条判据：`python eval/lint_gate.py`
      # （venv 的 dev 组里就有同版 ruff；隔离跑法见该脚本头注）。
      - name: 静态检查棘轮（ruff E/F/I/W 只许变小）
        run: uv run --frozen python eval/lint_gate.py

  # ═ 看板娘 pin 漂移提示（20261002）════════════════════════════════════════
  # **独立 job、只警告、恒绿**。上面那个 eval job 是门禁，这一条不是：它回答的是
  # "这次改了看板娘前端，父仓那个 pin 跟上了没有"。
  #
  # 为什么值得一条守卫：本仓 `frontend/public/live2d-widgets/` 是源码，线上跑的是父仓
  # `frontend/widget.lock.json` 里钉住的 sha 稀疏检出的**副本**。改了不 bump pin ⇒
  # 改动永远不上线，而**没有任何东西会变红**（本地绿、CI 绿、线上照旧）。纪律在父仓
  # lock 头注 / README / CONTRIBUTING 写了三处，但文档挡不住忘记，故补机械的。
  #
  # 为什么单独一个 job：它要 `fetch-depth: 0`（比 before..sha 的区间）和一枚 PAT，
  # 两样都不该塞进门禁 job 里去拖累它；独立 job 也保证它**无论怎样都不会把主干判红**。
  # 逻辑在 `scripts/widget_pin_drift.sh`（含"读不到父仓就明说再跳过"的三态处理）。
  widget-pin-drift:
    runs-on: ubuntu-latest
    env:
      PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 要比 before..sha 的改动区间
      - name: 与父仓 pin 比对（漂移则 ::warning::，恒退 0）
        run: bash scripts/widget_pin_drift.sh
