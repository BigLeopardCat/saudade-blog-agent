# Eval Gate —— push 跑秒级单测（L0）。
#
# **golden 全量评测集不进 CI（20260920 撤下）**，改为本机按需手动跑。
# 撤下的实测依据（run 35499800723 / 35506176321）：
#   - 北美 runner 调北美阿里云端点这条 LLM 腿**每次调用先吊住 ~120 秒**再走重试
#     （ChatOpenAI timeout=120s × langchain max_retries=2 ⇒ 单次调用最坏 6 分钟）；
#   - 3 条本机合计 39 秒的用例，在 CI 里跑 21 分钟仍未结束；期间生产机 access log
#     显示：18:50:37 语料热身（12 个请求）之后再无一个工具请求 ⇒ 卡在 LLM 腿，
#     与"回国调站点"那一腿无关（那一段实测健康，服务端 0-3ms）；
#   - 一次 120 分钟上限的全量跑被杀，且**零产出**（报告只在结尾写 + 非 TTY 块缓冲，
#     日志与 artifact 双双为空）。
#
# 全量 golden 在本机跑（本机即生产服务器，链路真实，约 127 条 / 25 分钟）：
#   cd saudade-blog-agent
#   .venv/bin/python eval/run_golden.py                     # 全量；--limit N / --only a,b / --min-pass-rate
#   .venv/bin/python eval/golden_full_run.py                # 进程隔离版：逐条独立进程 + 180s 超时，防悬挂
#   夜间 04:00 已有 scripts/nightly_regression.sh（crontab）跑 tests/run_all.py + 全量 golden + trace 巡检。
#
# 仓库 Secrets QUALITY_GATE_API_KEY / QUALITY_GATE_BASE_URL 与 Variables
# GOLDEN_MIN_PASS_RATE / QWEN_MODEL 已无引用，可留可删（留下不影响任何运行）。
name: Eval Gate

on:
  push:
    branches: [main]
  # 手动重跑秒级套件（无入参）；全量 golden 请按上面注释在本机跑
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen

      # 套件清单**只有一处事实源**：`tests/run_all.py` 按**磁盘**枚举 `tests/*.py`
      # （`_` 开头的辅助模块与 run_all 自己除外）。此前这里是**手工维护**的名单（一个套件一个
      # step），而审计实测（20260928）：磁盘上 50+ 个套件、这份名单只引用了 26 个
      # ⇒ **一半以上的判据在 CI 里从不运行**——其中就有 `test_prompt_prefix`（提示词前缀缓存
      # 稳定性的唯一哨兵）与 `test_slim_skills`。加了新套件忘了来这里加一行，表现是
      # "看着在跑、其实没跑"，而这种失效没有任何东西会告诉你。
      # 收敛成一条 step 之后，**加套件不用改 CI**。回归锁：`tests/test_ci_suite_list.py`
      # 断言这里不许再出现逐套件的 `tests/test_*.py` 调用，也断言夜间脚本与本文同源。
      # 全套秒级、无网络、无 LLM；run_all.py 内部钉住出厂档（PLANNER_ENGINE=text /
      # AGENT_TASK_STATE=0），不随仓库/运维环境的取值漂移。
      - name: 全部离线套件（按磁盘枚举，秒级、无网络、无 LLM）
        run: uv run python tests/run_all.py

      # 未定义名静态扫描（20260924 补）。Python 没有编译期拦截：一个只在**另一个作用域**
      # 存在的名字（server.py 的 `req` 写进了 `_run_agent_stream_to_queue`）要到运行到那一行
      # 才炸，而线上位置恰在图启动前 ⇒ 表现成"整轮零帧"，看着像模型没回复。那次事故挂了
      # 40 分钟、离线套件与夜间 golden 全都碰不到（见 docs/问题记录.md 1.43）。
      # 只开 F821 这一条规则是刻意的：其余 F/E 类（未使用导入等）不应拦住一次修复性推送。
      # **ruff 的版本从 `pyproject.toml` 的 `[dependency-groups] dev` 来**（上面
      # `uv sync --frozen` 已经把它按 uv.lock 装进项目环境），不再在这里手写
      # `uvx ruff@0.14.4`——同一件事写两处就是"改一处忘另一处"的形状（本轮 20260928 收敛）。
      # 本机跑同一条判据用隔离的 `uvx ruff@0.14.4 check --select F821 --no-cache .`
      # （**不许**在本机 `uv sync`：`.venv` 就是产线那个 venv）；版本若升，两处一起改，
      # `tests/test_ci_suite_list.py` ①b 会盯着它们是否同版。
      - name: 未定义名静态扫描（ruff F821，秒级）
        run: uv run --frozen ruff check --select F821 --no-cache .
