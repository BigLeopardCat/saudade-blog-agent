name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version

      - name: Widget Markdown security regression
        run: node --test frontend/tests/*.test.mjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Build and verify isolated distribution
        run: bash scripts/dev/package_smoke.sh

      - name: 未定义名静态扫描（ruff F821，秒级）
        run: uv run --frozen ruff check --select F821 --no-cache .

      - name: 类型检查棘轮（mypy 错误数只许变小）
        run: uv run --frozen python eval/type_gate.py

      - name: 静态检查棘轮（ruff E/F/I/W 只许变小）
        run: uv run --frozen python eval/lint_gate.py

      - name: 盲捕获棘轮（BLE001 只许变小）
        run: uv run --frozen python eval/except_gate.py

      - name: 安全扫描棘轮（bandit 只许变小）
        run: uv run --frozen python eval/security_gate.py

      # Public, immutable contract source; see docs/eval-observability.md.
      - name: Read host contract revision
        id: parent
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('.github/host-contract.json').read_text())
          if lock['repository'] != 'BigLeopardCat/Saudade-Blog' or not re.fullmatch(r'[0-9a-f]{40}', lock['revision']):
              raise SystemExit('Invalid public host contract lock')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"repository={lock['repository']}\nrevision={lock['revision']}\n")
          PYCODE

      - name: Checkout public host contract
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.parent.outputs.repository }}
          ref: ${{ steps.parent.outputs.revision }}
          path: _parent
          sparse-checkout: |
            src/routes
            tests/fixtures
            frontend/src/utils
            frontend/src/components/NoteTagSelect
          fetch-depth: 1
          persist-credentials: false

      - name: 父仓落位自检（锚 + 每一条锥模式都真拉到）
        run: |
          set -e
          test "$(git -C _parent rev-parse HEAD)" = "${{ steps.parent.outputs.revision }}"
          test -f _parent/src/routes/chat.rs
          test -f _parent/frontend/src/utils/stickers.ts
          test -f _parent/frontend/src/components/NoteTagSelect/index.tsx
          test -f _parent/src/authz.rs
          test -f _parent/tests/fixtures/document-reading.json

      # Identical required suites for forks, bots and maintainer branches.
      - name: 全部离线套件
        env:
          SAUDADE_PARENT_REPO: ${{ github.workspace }}/_parent
          SAUDADE_REQUIRE_PARENT: "1"
        run: uv run --frozen pytest -q -n 4 --durations=15 --junitxml=eval/report/ci/pytest.xml

      - name: 保存测试报告（含失败用例和耗时）
        if: ${{ !cancelled() && hashFiles('eval/report/ci/pytest.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/report/ci/pytest.xml
          if-no-files-found: error
          retention-days: 14

  task-input-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: task-input-ci
          POSTGRES_DB: agent_inputs_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: PostgreSQL integration with no skipped cases
        env:
          SAUDADE_TASK_INPUT_TEST_DSN: postgresql://postgres:task-input-ci@127.0.0.1:5432/agent_inputs_it
          SAUDADE_SCHEDULING_TEST_DSN: postgresql://postgres:task-input-ci@127.0.0.1:5432/agent_inputs_it
          SAUDADE_CKPT_TEST_DSN: postgresql://postgres:task-input-ci@127.0.0.1:5432/agent_inputs_it
          SAUDADE_REQUIRE_CKPT_TEST: "1"
        run: |
          uv run --frozen pytest -q tests/integration --junitxml=eval/report/ci/postgres.xml
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          suites = ET.parse('eval/report/ci/postgres.xml').getroot().findall('testsuite')
          assert suites and sum(int(suite.attrib['tests']) for suite in suites) > 0
          assert all(int(suite.attrib['skipped']) == 0 for suite in suites), 'Integration tests skipped'
          PYCODE

  widget-pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 与父仓 pin 比对（漂移则 ::warning::，恒退 0）
        run: bash scripts/widget_pin_drift.sh

  widget-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked browser test dependency
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Install browser system dependencies
        timeout-minutes: 6
        working-directory: frontend
        run: |
          # hosted runner 的 HTTP Azure 镜像多次仅几十 KB/s；使用 Ubuntu 官方 HTTPS 源。
          sudo tee /etc/apt/saudade-ci.sources.list >/dev/null <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          EOF
          sudo tee /etc/apt/apt.conf.d/80-saudade-ci-network >/dev/null <<'EOF'
          Dir::Etc::sourcelist "/etc/apt/saudade-ci.sources.list";
          Dir::Etc::sourceparts "-";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          npx --no-install playwright install-deps chromium
      - name: Cache checksum-verified CJK font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/fonts/saudade-ci
          key: noto-cjk-sc-2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b
      - name: Install pinned CJK font
        timeout-minutes: 4
        run: bash scripts/ci/install-cjk-font.sh
      - name: Install Chromium
        working-directory: frontend
        timeout-minutes: 4
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 45000
        run: npx --no-install playwright install chromium
      - name: Chat interaction and responsive image regression
        working-directory: frontend
        env:
          CHAT_UI_PREVIEW_DIR: ${{ runner.temp }}/chat-ui-preview
        run: npm run test:browser
      - name: Keep synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-ui-preview
          path: ${{ runner.temp }}/chat-ui-preview
          retention-days: 7
          if-no-files-found: ignore
