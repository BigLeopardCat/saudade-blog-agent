name: Dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: '0.11.28'
          python-version: '3.12'
      - name: Export locked runtime, development and optional dependencies without installing them
        run: uv export --frozen --all-groups --all-extras --no-emit-project --output-file "$RUNNER_TEMP/all-requirements.txt" > /dev/null
      - name: Audit the exact versions against PyPI advisories
        run: >-
          uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes
          -r "$RUNNER_TEMP/all-requirements.txt"
          --format json --output "$RUNNER_TEMP/all-audit.json"
      - name: Preserve the audit and locked input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/all-requirements.txt
            ${{ runner.temp }}/all-audit.json
          if-no-files-found: warn
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - name: Audit locked widget runtime and development packages
        working-directory: frontend
        run: npm audit --package-lock-only --include=dev --audit-level=moderate --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-audit.json"
      - name: Preserve widget dependency findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: widget-dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
