[project]
name = "saudade-agent"
version = "0.2.0"
description = "博客工具助手：按需工具调用、持久会话与服务端授权"
readme = "README.md"
# Runtime, tooling and CI target Python 3.12.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "BigLeopardCat", email = "132721665+BigLeopardCat@users.noreply.github.com" }]
keywords = ["llm", "agent", "langgraph", "rag", "chatbot", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Direct runtime dependencies; uv.lock pins reproducible installations.
dependencies = [
    "anyio==4.14.1",
    "edge-tts==7.2.8",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-core==1.6.10",
    "langchain-openai==1.3.3",
    "langgraph==1.2.12",
    # 原生 checkpoint 持久化与恢复安全的快照裁剪。
    "langgraph-checkpoint-postgres==3.2.0",
    "openai==3.35.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    # JWT authentication uses the installed PyJWT implementation.
    "PyJWT==2.15.1",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
    "langchain==1.4.6",
    "langchain-deepseek==1.1.1",
    "bm25s==0.3.15",
]

# Test, analysis and optional offline evaluation tools.
[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage[toml]==7.16.2",
    "httpx-sse==0.4.3",
    "ir-measures==0.4.3",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.14.4",
    "scipy==1.18.1",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
embedding-tokenizer = ["tokenizers==0.22.2"]
rag-data = ["pyarrow==26.0.0"]

[project.urls]
Homepage = "https://github.com/BigLeopardCat/saudade-blog-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Application packages include the ASGI entry agent.main and its service modules.
packages = ["agent", "config", "models", "rag", "tools", "utils"]

[tool.pytest.ini_options]
# Offline tests use mocks or their own temporary loopback service.
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
# CI 显式设置并行度；本地默认串行。
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
# 与运行环境和类型检查基线使用同一 Python 版本。
python_version = "3.12"
strict = false
ignore_missing_imports = true

# 覆盖率用于报告，不设置未经校准的通过阈值。
[tool.coverage.run]
source = ["agent", "config", "models", "rag", "tools", "utils"]
# 并发测试分别写入数据，之后 combine。
parallel = true
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
