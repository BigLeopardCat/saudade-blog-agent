[project]
name = "saudade-agent"
version = "0.2.0"
description = "博客工具助手：按需工具调用、持久会话与服务端授权"
readme = "README.md"
# Runtime, tooling and CI target Python 3.12.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "BigLeopardCat", email = "132721665+BigLeopardCat@users.noreply.github.com" }]
keywords = ["llm", "agent", "langgraph", "rag", "chatbot", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Direct runtime dependencies; uv.lock pins reproducible installations.
dependencies = [
    "edge-tts==7.3.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.17",
    # 原生 checkpoint 持久化与恢复安全的快照裁剪。
    "langgraph-checkpoint-postgres==3.2.0",
    "openai==2.44.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    # JWT authentication uses the installed PyJWT implementation.
    "PyJWT==2.15.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "langchain==1.4.7",
    "langchain-deepseek==1.1.1",
    "bm25s==0.3.15",
]

# Test, analysis and optional offline evaluation tools.
[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage[toml]==7.17.0",
    "httpx-sse==0.4.3",
    "ir-measures==0.4.3",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.2",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
embedding-tokenizer = ["tokenizers==0.23.3"]
rag-data = ["pyarrow==26.0.0"]

[project.urls]
Homepage = "https://github.com/BigLeopardCat/saudade-blog-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Application packages include the ASGI entry agent.main and its service modules.
packages = ["agent", "config", "models", "rag", "tools", "utils"]

[tool.pytest.ini_options]
# Offline tests use mocks or their own temporary loopback service.
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
# 单测试超时 300s（对齐原 run_all 的套件档）。并行（`-n 4`）由 CI 显式传、这里不写死——
# 串行是默认（本机与夜间都串行），与 run_all「串行是默认、CI 显式 -j 4」同一条纪律。
timeout = 300

[tool.ruff]
line-length = 100
# 与 `requires-python` 同一个值（`tests/test_packaging.py` ⑥ 判着）。留着它是"别写出
# 低版本解释器不认的语法"这条约束的机器化——虽然 `requires-python` 已经把它表达了。
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
# ⚠️ 这一项**会改变报出来的错误集**（比如 3.11+ 的 `ExceptionGroup`/`Self`、3.12 的
# 泛型语法），而 `eval/type_gate.py` **不传 `--python-version`** ⇒ 目标只来自这一行。
# 20261013 升 3.12 时发现的洞：基线当时只记 `mypy_version`，于是"换解释器目标"这种
# **换了一个量**的改动在棘轮眼里和"没动过"长得一样（错误数没涨就不报）。
# ⇒ 现在基线里也记 `python_target`，对不上退 3（同 mypy 版本那一档）。
python_version = "3.12"
strict = false
ignore_missing_imports = true

# 覆盖率（20261013）：只出报告，**不设阈值、不进 CI**（见 dev 组那段注释）。跑法 =
# `bash scripts/dev/coverage.sh`；`source` 只列**生产包**——`tests/` 与 `eval/` 是被测对象
# 不是被测代码，把它们算进去只会把那个百分比稀释成一个谁都不看的数。
[tool.coverage.run]
source = ["agent", "config", "models", "rag", "tools", "utils"]
# `parallel = true`：每个进程各写各的 `.coverage.<host>.<pid>.<rand>`，跑完 `combine`
# 合成一份（`scripts/dev/coverage.sh` 指定它们的落点）。不开这个，后一个进程会
# **整份覆盖**前一个的数据，报出来的永远是"最后跑的那一份是什么"。
# 今天比 20261013 那次更要紧：`pytest -n 4` 与 `pytest-cov` 都会起多个进程。
parallel = true
# `no-data-collected` 这条警告**按套件**打：有一套是纯读文件做判据的（编码/换行/CHANGELOG
# 结构），一行生产代码都不碰 ⇒ 它每一次都合法地"没采到数据"，而那句话会插在套件输出中间，
# 反复喊一件正常的事。（20261013 那版还有半句"整档没工作由 run_all.py 自己判"——那个
# 判断随 run_all.py 一起没了；今天 `.coverage-data/` 空着就是"没采到"，看一眼就知道。）
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
# 报**全量**（不用 `--skip-covered`）：完全没被测到的文件正是最该看见的那部分，
# 而 `--skip-covered` 恰好把它们藏起来。
show_missing = true
# 三样排除物，都**不是**可执行分支，算进来只会让"没覆盖到"指向一句 never 的话：
# `TYPE_CHECKING` 块（运行期不存在）、`NotImplementedError` 兜底、`# pragma: no cover`。
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
