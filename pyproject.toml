[project]
name = "saudade-agent"
version = "0.2.0"
description = "泠月喵看板娘 AI 对话 Agent：LangGraph 技能注册表 + 模板质检 + 评测驱动的对话系统"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "openai>=2.44.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.28.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/BigLeopardCat/saudade-blog-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/", "chains/", "config/", "models/", "tools/", "utils/"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
