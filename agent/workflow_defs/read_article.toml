# ═══════════════════════════════════════════════════════════════════════════
#  技能 · read_article                      注册表序位 7/50
#
#  **系统专用**：它的 `article_id` 由页面上下文 `current_url` 解析、planner 无参可填，
#  因此不进 planner 菜单（见 `__init__.py` 的 `_SYSTEM_ONLY_WORKFLOWS`）。
#  它住在公开读这一族里而不是别处：同族的读技能，"谁看得见它"的判据只能有一处。
#
#  它也是注册表里**唯一带固定 `plan` 的读技能**——那正是"确定性快道"的定义。
# ═══════════════════════════════════════════════════════════════════════════

order = 70
name = "read_article"

# 20260901 系统性修复（用户评审定性："读当前文章"是固定流程任务）：模型对"用户当前在读
# 的文章"只有 page_ctx 文本提示（current_url=/article/21），无结构化事实、无强制读取
# ——于是零工具声称"这篇我读完了"编造全文（232107：600 字细节全部虚构；232302：模型自己
# 承认没读过、但系统没有机制强制去读）。本技能 = 固定流程：planner_node 的确定性快道
# `_article_fast_path` 从 current_url 解析文章 ID 后注入本技能实例化，TOOLS 行强制
# get_article_detail → execute 必执行（有执行必有帧）。文章 ID 是系统数据，不经 planner 决策。
description = """\
    （系统确定性快道专用，planner 不得选择——由 planner_node 在用户当前页面为文章详情页\
    且消息引用当前文章时注入）读取用户当前正在阅读的文章全文后回答\
    """

complete_when = "get_article_detail 返回文章全文"
reply_contract = """\
    必须调用 get_article_detail 读取用户当前阅读的文章全文后再回答；\
    对文章内容的所有引用（标题/观点/细节/写法评价）必须来自工具返回，不得编造；\
    工具返回读取失败（文章不存在）时如实告知\
    """

# 没有 `capability`：它是系统快道专用技能，不对外介绍（空串 = 不列进能力清单）。
# 没有 `inputs` 里那条以外的东西，也没有 `roles`（空集 = 所有角色可见，由快道自己把关）。

[inputs]
article_id = "当前文章 ID（系统从页面上下文 current_url 解析，planner 不决策）"

# 固定序列：`$article_id` 是"从上一轮工具返回 / 系统注入的参数里取同名值"的引用
# （解析在 `workflow_plan.instantiate_plan`，不是这里）。
[[plan]]
tool = "get_article_detail"
args = { article_id = "$article_id" }
