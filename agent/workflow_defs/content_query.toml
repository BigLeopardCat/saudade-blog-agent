# ═══════════════════════════════════════════════════════════════════════════
#  技能 · content_query                     注册表序位 6/50
#
#  查站内内容的**唯一入口**。它是注册表里最重的一条：知识型问题、数据/列表型查询、
#  页面存在性质疑全走它，而"必须先取回真实数据再作答"那句硬话也长在这里。
#
#  `order` 是**保序契约**：planner 菜单的排列与 `visible_workflows` 的产出顺序都按它
#  来 ⇒ 改了就是提示词字节变了，要 golden A/B 才敢做（见 loader.py 头注）。
# ═══════════════════════════════════════════════════════════════════════════

order = 60
name = "content_query"
capability = "查站内内容并给真实来源：文章/说说/河灯留言/公告/站点信息"

# 20260903 架构裁决（planner 全权，自由 ReAct 废除）：内容查询不再有"执行层自由选择"
# ——planner 每轮直接产出调用清单（PARAMS.calls，带参白名单校验），execute 节点确定性
# 执行，多轮规划由 planner 驱动：先检索定位 → 看工具帧 → 决定 get_article_detail 读哪篇
# / 换词再搜 / 收尾如实答复。检索器选型（search_notes 关键词 vs rag_search 相关度）与
# 关键词抽取都是 planner 决策，模型/执行层零自由——"跳过检索直接答"在结构上不可能
# （调用清单是计划的组成部分）。
description = """\
    用户询问博客内容时使用（文章/说说/留言/公告/站点信息里的内容）——包括：\
    知识型问题（文章里写了什么、怎么做、是什么，\
    如\"Git 和 SVN 有什么区别\"\"ESP32 的 OTA 怎么配置\"）；\
    数据/列表型查询（最新留言/说说/公告、文章列表、封面图片、分类/标签/天气/时间/\
    站点信息/社交链接/置顶文章）；\
    页面/内容存在性质疑（如\"真有这个页面？确定有这篇？\"——查证页面或\
    内容是否存在；\
    执行是否属实的问题归跨轮执行记忆（页面上下文『确认与执行事实』块里『已执行』那半），\
    见规划规则 6，不在本技能范围）。\
    \n涉站内容**必须先取回真实数据再作答**：知识型/验证型给 calls（search_notes/\
    rag_search 定位、get_article_detail 读全文），数据/列表型点名 tools；\
    除收尾轮（已有工具返回且信息足够 / 明确查无结果）外不许空着手回答。\
    问「留言板/说说里有没有人聊过、写过 X」时必须**成对**点名两个数据源：\
    list_guestbook 与 list_talks（只点一个 = 少查一半，等于没查）\
    """

complete_when = "回答基于工具返回的数据"

# ⚠️ 上面 `description` 里 `\n` 之后那一整段是**「必须怎么做」**（`Workflow.contract`
# 按第一个 `\n` 切）。它 20261017 才**并回** `description`——此前是一个独立字段
# `planner_contract`，拆它的依据被实测推翻：`rag_talk_rag` 完整菜单 5/5 绿 → slim 0/5 红
# **是信息丢失不是位置**（slim 臂 schema 里原样漏着未展开的 `__无参只读工具清单__`，而
# `tools` 参数描述又被 `_SCHEMA_OVERRIDES` 盖成一句没有工具名的话 ⇒ 两个工具名在 schema
# 里两条路都没出现）。四臂重验（`eval/contract_position_ab.py`，7 用例 × 12 遍）**逐档
# 相同**：只住正文 84/84、只住 schema 84/84、并进 description 84/84、**整句删掉 73/84**
# ⇒ **位置无关，那句话本身承重**。**别再拆出来**——拆一次就多守一条"两份会漂"的纪律。
# 那两条"必须怎么做"（① 必须给调用清单 ② 成对点名）各自的原委见 `docs/问题记录.md`。

# 20261007 补（行为红 `rag_project_files`：清洗后窗口 10/62 轮、本机基线 2/4）：命中了几篇、
# 但那几篇**都没写到被问的那一项**时，模型把"常见工程惯例"补成了《架构文档》里的目录结构
# （答复形如"根据架构文档…配置文件主要有这些"）——命中文章成了挡箭牌，常识换了个出处照样
# 当站内事实。两条：常识与站内**分开落款**、命中文章讲的是别的对象时不许顶替。
reply_contract = """\
    回答基于工具返回的数据，不得编造；检索无结果或无关时如实告知\
    （'站内没有找到相关资料'是正当结论，不得改用模型记忆硬答）。\
    命中了几篇但都**没写到**被问的那一项时，如实说那一项站内没有写到，\
    **不许**用通用常识/行业惯例把它补成一份看着像站内给出的清单；\
    要补充常识就明说那是常识、不是站内文章里写的；\
    命中的文章讲的是**别的对象**（别的仓库、别的子系统）时，\
    不许把它说成回答了所问的那一项。\
    查询'博客/留言板/说说里有没有人聊过/写过 X'这类问题时，\
    以工具返回为准如实告知两个数据源都查过了什么；\
    问题针对用户当前正在阅读的文章（页面上下文 current_url 为 /article/:id）时，\
    必须先经 get_article_detail 读取该文章，基于真实全文回答\
    """

[inputs]
tools = "（可选）无参只读数据工具点名列表，仅限 __无参只读工具清单__"
# 那两个 `__…__` 是**占位标记**（`workflow_model._EXPLICIT_TOOLS_MARK` /
# `_PARAM_TOOLS_MARK`），由 `workflow_menu.render_tool_marks` 按角色展开成真实工具名。
# 刻意**不含花括号**——整份 planner 提示词最后要过 `_PLANNER_PROMPT.format(...)`。
calls = """\
    （可选）带参调用清单：[{\"tool\": \"search_notes\", \"args\": {\"keyword\": \"用户原词\"}]；\
    工具仅限 __带参工具清单__；get_article_detail 的 id 只能取自上一轮工具返回\
    """

# `plan` 缺省为空 = **调用清单由 planner 经 PARAMS.tools/calls 注入**，本技能的实例化只
# 负责按白名单校验并展开。这不是"没写"，是这一条技能的定义本身（对照 read_article：
# 那一条有固定序列）。配置格式里"缺席 = 空"是唯一读法——TOML 没有 null，见 loader 头注。
